---
# LVM backend. encrypted_storage_pool_action: create | destroy.
# Expects encrypted_storage_pool_devices_resolved (from resolve-disks.yml).

- name: "LVM | destroy the existing volume group"
  when: encrypted_storage_pool_action | default('create') == 'destroy'
  block:
    - name: "LVM | unmount + drop the fstab entry"
      ansible.posix.mount:
        path: "{{ encrypted_storage_pool_mountpoint }}"
        state: absent

    - name: "LVM | remove the volume group (if present)"
      ansible.builtin.command: "vgremove -f {{ encrypted_storage_pool_name }}"
      register: encrypted_storage_pool_vgremove
      changed_when: encrypted_storage_pool_vgremove.rc == 0
      failed_when: false

    - name: "LVM | wipe PV/filesystem signatures from the crypt-* members"
      ansible.builtin.command: "wipefs -a /dev/mapper/crypt-{{ item }}"
      loop: "{{ encrypted_storage_pool_devices_resolved }}"
      changed_when: true
      loop_control:
        label: "crypt-{{ item }}"

- name: "LVM | create + mount"
  when: encrypted_storage_pool_action | default('create') == 'create'
  block:
    - name: "LVM | check whether the volume group exists"
      ansible.builtin.command: "vgs {{ encrypted_storage_pool_name }}"
      register: encrypted_storage_pool_vg_exists
      changed_when: false
      failed_when: false
      check_mode: false

    - name: "LVM | create PVs + VG + LV + filesystem"
      when: encrypted_storage_pool_vg_exists.rc != 0
      block:
        - name: "LVM | pvcreate the crypt-* members"
          ansible.builtin.command: "pvcreate -f /dev/mapper/crypt-{{ item }}"
          loop: "{{ encrypted_storage_pool_devices_resolved }}"
          changed_when: true
          loop_control:
            label: "crypt-{{ item }}"

        - name: "LVM | vgcreate {{ encrypted_storage_pool_name }}"
          ansible.builtin.command: >-
            vgcreate {{ encrypted_storage_pool_name }}
            {{ encrypted_storage_pool_devices_resolved | map('regex_replace', '^', '/dev/mapper/crypt-') | join(' ') }}
          changed_when: true

        - name: "LVM | prepare the explicit PV list (pins raid image placement)"
          ansible.builtin.include_tasks: lvm-device-order.yml

        - name: "LVM | compute the topology's RAID geometry for lvcreate"
          # mirror -> raid1 (-m1, one redundant copy); stripe -> striped across all
          # PVs; raid10 -> striped over 2-way mirrors, so stripes = members / 2.
          ansible.builtin.set_fact:
            _esp_lvm_geometry: >-
              {{ {'mirror': '--type raid1 -m1',
                  'stripe': '--type striped -i ' ~ (encrypted_storage_pool_devices_resolved | length),
                  'raid10': '--type raid10 -i ' ~ ((encrypted_storage_pool_devices_resolved | length) // 2)
                 }[encrypted_storage_pool_topology] }}

        # ── Thick (default): one data LV filling the VG ─────────────────────────
        - name: "LVM | lvcreate the thick data LV, topology {{ encrypted_storage_pool_topology }}"
          # The trailing PV list is what pins which disk carries which raid image,
          # and therefore which two disks form a mirror pair. Empty -> LVM's own
          # allocator chooses, as before.
          ansible.builtin.command: >-
            lvcreate -y -n data -l 100%FREE {{ _esp_lvm_geometry }}
            {{ encrypted_storage_pool_name }} {{ _esp_pv_order }}
          when: not (encrypted_storage_pool_lvm_thin | default(false) | bool)
          changed_when: true

        # ── Thin (encrypted_storage_pool_lvm_thin=true): RAID pool + thin volume ─
        # The pool's data LV carries the topology geometry (e.g. raid10); lvconvert
        # then turns it into a thin pool (carving metadata from the reserved VG
        # headroom), and a thin 'data' volume is created on top — so the mount src
        # (/dev/<vg>/data) is identical to the thick path.
        - name: "LVM | thin | lvcreate the pool data LV, topology {{ encrypted_storage_pool_topology }}"
          # Same trailing PV list: the thin pool's DATA LV is the raid10 one, so
          # this is where fault-domain-aware placement has to land.
          ansible.builtin.command: >-
            lvcreate -y -n {{ encrypted_storage_pool_lvm_thin_pool_name }}
            -l {{ encrypted_storage_pool_lvm_thin_pool_extents }} {{ _esp_lvm_geometry }}
            {{ encrypted_storage_pool_name }} {{ _esp_pv_order }}
          when: encrypted_storage_pool_lvm_thin | default(false) | bool
          changed_when: true

        - name: "LVM | thin | convert the RAID LV into a thin pool (auto metadata)"
          ansible.builtin.command: >-
            lvconvert -y --type thin-pool
            {{ encrypted_storage_pool_name }}/{{ encrypted_storage_pool_lvm_thin_pool_name }}
          when: encrypted_storage_pool_lvm_thin | default(false) | bool
          changed_when: true

        - name: "LVM | thin | read the pool's data size (for a 1:1, non-overprovisioned volume)"
          ansible.builtin.command: >-
            lvs --noheadings --nosuffix --units b -o lv_size
            {{ encrypted_storage_pool_name }}/{{ encrypted_storage_pool_lvm_thin_pool_name }}
          register: encrypted_storage_pool_thin_pool_size
          changed_when: false
          when:
            - encrypted_storage_pool_lvm_thin | default(false) | bool
            - not (encrypted_storage_pool_lvm_thin_virtual_size | default('') | length > 0)

        - name: "LVM | thin | lvcreate the thin data volume"
          # Virtual size: explicit override if set, else match the pool 1:1.
          ansible.builtin.command: >-
            lvcreate -y --type thin -n data
            --thinpool {{ encrypted_storage_pool_lvm_thin_pool_name }}
            -V {{ (encrypted_storage_pool_lvm_thin_virtual_size | default('') | length > 0)
                  | ternary(encrypted_storage_pool_lvm_thin_virtual_size,
                            (encrypted_storage_pool_thin_pool_size.stdout | default('') | trim) ~ 'B') }}
            {{ encrypted_storage_pool_name }}
          when: encrypted_storage_pool_lvm_thin | default(false) | bool
          changed_when: true

        - name: "LVM | mkfs.ext4 on the data LV"
          ansible.builtin.command: >-
            mkfs.ext4 -F -L {{ encrypted_storage_pool_name }}
            /dev/{{ encrypted_storage_pool_name }}/data
          changed_when: true

    - name: "LVM | mount now + record a noauto,_netdev fstab entry"
      ansible.posix.mount:
        path: "{{ encrypted_storage_pool_mountpoint }}"
        src: "/dev/{{ encrypted_storage_pool_name }}/data"
        fstype: ext4
        opts: "noauto,_netdev,x-systemd.after=network-online.target"
        state: mounted

    # Deliberately OUTSIDE the "VG does not exist yet" block above: LVM's default
    # thin-pool conversion leaves the metadata LV linear on ONE disk, so pools built
    # by earlier versions of this role carry that exposure and must be able to gain
    # redundancy in place on an ordinary converge. Idempotent — already-mirrored
    # metadata is detected and skipped.
    - name: "LVM | thin | ensure the pool's metadata is mirrored, not linear on one disk"
      ansible.builtin.include_tasks: lvm-thin-metadata.yml
      when:
        - encrypted_storage_pool_lvm_thin | default(false) | bool
        - encrypted_storage_pool_lvm_thin_meta_mirrored | default(true) | bool
