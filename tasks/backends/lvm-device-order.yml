---
# PURE preparation of the explicit PV list for lvcreate — no commands, no devices.
#
# Why an explicit list at all
# ---------------------------
# `lvcreate --type raid10 -i N` with no trailing PV list lets LVM's allocator
# choose which PV carries which raid image, so which two disks end up as a mirror
# PAIR is out of the caller's hands. Naming the PVs pins it: image k lands on the
# k-th PV in the list, and mirror partners are ADJACENT images ((0,1), (2,3), ...
# — MD's near layout with 2 copies). Verified by failure injection at -i 2 and
# -i 5: killing both members of a pair loses the data, killing one per pair does
# not.
#
# That is the only lever a caller has against a shared-bus failure taking out both
# halves of a mirror, and it is why this role accepts an order at all: the caller
# knows the hardware topology, this role does not.
#
# Inputs:
#   encrypted_storage_pool_device_order       the caller's ordered member list
#   encrypted_storage_pool_devices_resolved   the pool's actual members
# Output:
#   _esp_pv_order   space-joined PV paths for lvcreate, or '' for "let LVM choose"
#
# tests/device-order/ drives this file directly with synthetic lists.

- name: "Device order | normalise the caller's order to PV paths"
  # Members may be spelled three ways — a bare crypttab name (the UUID), a
  # crypt-<uuid> mapper name, or a full path. All three are accepted so the caller
  # need not know which vocabulary this role happens to use internally.
  ansible.builtin.set_fact:
    _esp_order_paths: >-
      {%- set out = [] -%}
      {%- for d in (encrypted_storage_pool_device_order | default([])) -%}
        {%- if d.startswith('/') -%}
          {%- set _ = out.append(d) -%}
        {%- elif d.startswith('crypt-') -%}
          {%- set _ = out.append('/dev/mapper/' ~ d) -%}
        {%- else -%}
          {%- set _ = out.append('/dev/mapper/crypt-' ~ d) -%}
        {%- endif -%}
      {%- endfor -%}
      {{ out }}
    _esp_member_paths: >-
      {%- set out = [] -%}
      {%- for d in (encrypted_storage_pool_devices_resolved | default([])) -%}
        {%- if d.startswith('/') -%}
          {%- set _ = out.append(d) -%}
        {%- elif d.startswith('crypt-') -%}
          {%- set _ = out.append('/dev/mapper/' ~ d) -%}
        {%- else -%}
          {%- set _ = out.append('/dev/mapper/crypt-' ~ d) -%}
        {%- endif -%}
      {%- endfor -%}
      {{ out }}

# A partial, padded or foreign order is refused rather than used or ignored. Using
# it would place data on the wrong disks; ignoring it would silently drop a safety
# decision the caller made deliberately, and the resulting pool would look
# intentional. Both are worse than stopping.
- name: "Device order | the order must name EXACTLY the pool's members"
  ansible.builtin.assert:
    that:
      - (_esp_order_paths | sort) == (_esp_member_paths | sort)
    fail_msg: >-
      encrypted_storage_pool_device_order does not match this pool's members.
      Ordered: {{ _esp_order_paths | sort }}.
      Members: {{ _esp_member_paths | sort }}.
      Missing from the order: {{ _esp_member_paths | difference(_esp_order_paths) }}.
      Not pool members: {{ _esp_order_paths | difference(_esp_member_paths) }}.
      Refusing to create the LV — a partial order would place raid images on
      devices the caller did not choose, while still looking deliberate.
    success_msg: >-
      device order names all {{ _esp_member_paths | length }} member(s); raid image
      placement will follow it
    quiet: true
  when: (_esp_order_paths | length) > 0

- name: "Device order | build the trailing PV list for lvcreate"
  ansible.builtin.set_fact:
    _esp_pv_order: "{{ _esp_order_paths | join(' ') }}"
