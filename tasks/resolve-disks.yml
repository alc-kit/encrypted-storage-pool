---
# Resolve the data disks (bare names, e.g. vdb) whose crypt-<disk> mappers form
# the pool, into encrypted_storage_pool_devices_resolved. Explicit override wins;
# otherwise derive from the crypt-* entries clevis_encryption wrote to /etc/crypttab.
# DEPRECATED: the explicit device list. Which disks are encrypted is a decision
# for inventory / the clevis_encryption (NBDE) layer, not this consumer; the
# supported path is to derive members from the crypt-<uuid> entries clevis writes
# to /etc/crypttab. A bare-node explicit list (e.g. [vdb]) is also WRONG under the
# persistent crypt-<LUKS-UUID> naming (the mapper is crypt-<uuid>, not crypt-vdb).
- name: "Resolve disks | WARN that the explicit device list is deprecated"
  ansible.builtin.debug:
    msg: >-
      encrypted_storage_pool_devices is DEPRECATED — members are derived from the
      crypt-* entries in /etc/crypttab. Unset it. If kept, each entry names a LUKS
      mapper by its UUID — `<uuid>`, `crypt-<uuid>` and `/dev/mapper/crypt-<uuid>` are
      all accepted — never a bare device node such as vdb.
  when: encrypted_storage_pool_devices is defined

- name: "Resolve disks | use the explicit list if provided (deprecated)"
  ansible.builtin.set_fact:
    # The backends prefix `crypt-` themselves (/dev/mapper/crypt-<item>), so the
    # members are held as the bare UUID. Accept every spelling and normalise: the
    # old message asked for `crypt-<uuid>`, which became crypt-crypt-<uuid>.
    encrypted_storage_pool_devices_resolved: >-
      {{ encrypted_storage_pool_devices
         | map('regex_replace', '^/dev/mapper/', '')
         | map('regex_replace', '^crypt-', '')
         | list }}
  when: encrypted_storage_pool_devices is defined

- name: "Resolve disks | derive from /etc/crypttab crypt-* entries"
  when: encrypted_storage_pool_devices is not defined
  block:
    - name: "Resolve disks | read crypt-* mapper names from /etc/crypttab"
      ansible.builtin.shell:
        cmd: |
          awk '$1 ~ /^crypt-/ {sub(/^crypt-/, "", $1); print $1}' /etc/crypttab 2>/dev/null || true
        executable: /bin/bash
      register: encrypted_storage_pool_crypttab
      changed_when: false
      check_mode: false

    - name: "Resolve disks | set encrypted_storage_pool_devices_resolved from crypttab"
      ansible.builtin.set_fact:
        encrypted_storage_pool_devices_resolved: "{{ encrypted_storage_pool_crypttab.stdout_lines | default([]) }}"
