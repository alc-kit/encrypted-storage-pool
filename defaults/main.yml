---
# ── encrypted_storage_pool defaults ─────────────────────────────────────────
# A generic storage-pool consumer for LUKS mappers unlocked by clevis_encryption.
# Assembles a btrfs or LVM pool on the crypt-* devices, consumes
# clevis-luks-unlocked.target, and emits encrypted-storage-ready.target.

# Master switch — set false to make the role a no-op.
encrypted_storage_pool_enabled: true

# Storage backend: btrfs | lvm. Both are mainline — no DKMS.
encrypted_storage_pool_backend: btrfs

# Pool identity: btrfs filesystem LABEL / LVM volume-group name.
encrypted_storage_pool_name: data

# Redundancy: mirror | stripe | raid10.
#   btrfs → mirror = raid1 (data+metadata); stripe = single; raid10 = raid10.
#   lvm   → mirror = --type raid1 -m1; stripe = --type striped; raid10 = --type raid10.
# Member-count guards (tasks/validate-topology.yml): mirror/stripe need >=2 disks,
# raid10 needs >=4 AND an even count (a stripe over 2-way mirrored pairs).
encrypted_storage_pool_topology: mirror

# Where the assembled filesystem is mounted (fstab noauto + a boot unit mounts it
# after the unlock seam — NOT early via local-fs, to avoid the ordering cycle).
encrypted_storage_pool_mountpoint: "/srv/{{ encrypted_storage_pool_name }}"

# Data disks (bare names, e.g. [vdb, vdc]) whose crypt-<disk> mappers form the
# pool. Leave unset to derive from the crypt-* entries in /etc/crypttab.
# encrypted_storage_pool_devices: []

# Create/assemble the pool on every run (idempotent).
encrypted_storage_pool_ensure: true

# Install the backend userland (btrfs-progs / lvm2).
encrypted_storage_pool_install_packages: true

# DESTRUCTIVE: destroy an existing pool before (re-)creating.
encrypted_storage_pool_destroy_existing: false

# ── Degraded assembly (lvm backend) ─────────────────────────────────────────
# When a member device is missing at boot (dead disk, or a mapper that never
# unlocked), come up DEGRADED on the surviving copies instead of not coming up at
# all — the behaviour a ZFS mirror gives you for free via `zpool import`.
#
# Needed because LVM refuses to activate a partial THIN POOL under its default
# `activation_mode = "degraded"`; only `--activationmode partial` will, and that
# mode is indiscriminate. So the assemble script escalates to `partial` ONLY after
# /usr/local/sbin/encrypted-storage-redundancy-check confirms every extent still
# has a surviving copy (every raid10 mirror pair keeps an image, mirrored metadata
# keeps a leg, and nothing non-redundant is on a missing PV). If the loss is NOT
# covered, the pool stays down and encrypted-storage-ready.target is never
# reached — fail closed, deliberately.
#
# Set false to keep the old behaviour: a pool with any missing device stays down.
encrypted_storage_pool_degraded_activation: true

# ── LVM thin provisioning (lvm backend only) ────────────────────────────────
# When true, the lvm backend builds a thin POOL whose data LV carries the chosen
# topology's RAID geometry (e.g. raid10), plus a thin volume on top, instead of a
# plain linear/raid LV. The btrfs backend ignores these. thin-provisioning-tools
# is installed automatically (packages.yml) when this is enabled.
encrypted_storage_pool_lvm_thin: false

# Extents for the thin pool's data LV. Leave VG headroom so `lvconvert` can carve
# the pool metadata LV — do NOT set this to 100%FREE.
encrypted_storage_pool_lvm_thin_pool_extents: "95%FREE"

# Thin pool LV name. The user-facing volume stays 'data', so the mount source
# (/dev/<vg>/data) is identical to the thick path.
encrypted_storage_pool_lvm_thin_pool_name: "tpool"

# Virtual size of the thin 'data' volume. Empty → match the pool's data size 1:1
# (no over-provisioning). Set e.g. "4T" to deliberately over-provision.
encrypted_storage_pool_lvm_thin_virtual_size: ""
