---
# Post-REBOOT assertions for the MULTI-DISK RAID10 scenario (boot 2). Same real
# cross-role boot chain as the vm scenario (clevis unlocked all 10 disks from the
# external Tang, reached clevis-luks-unlocked.target, and the assemble -> check ->
# ready chain mounted the pool across the seam), PLUS raid10/thin-specific profile
# assertions. Disk-count-agnostic: every per-disk loop derives from clevis_raw_disks.
- name: "Verify the RAID10 split boot chain (clevis NBDE + encrypted_storage_pool), post-reboot"
  hosts: clevis-target
  become: true
  gather_facts: false
  vars:
    esp_mnt: "/srv/{{ encrypted_storage_pool_name | default('data') }}"
    esp_expected: /var/lib/esp-integrity.expected.sha256
    esp_backend: "{{ encrypted_storage_pool_backend | default('btrfs') }}"

  tasks:
    - name: "Assert encrypted-storage-ready.target reached (the boot barrier)"  # noqa: command-instead-of-module
      ansible.builtin.command: systemctl is-active encrypted-storage-ready.target
      register: _esp_ready
      changed_when: false
      failed_when: _esp_ready.stdout != "active"

    - name: "Assert clevis-luks-unlocked.target is active (the cross-role seam)"  # noqa: command-instead-of-module
      ansible.builtin.command: systemctl is-active clevis-luks-unlocked.target
      register: _esp_unlocked
      changed_when: false
      failed_when: _esp_unlocked.stdout != "active"

    - name: "Read this boot's journal for clevis-luks-unlocked.target"  # noqa: command-instead-of-module
      ansible.builtin.command: journalctl -b -u clevis-luks-unlocked.target --no-pager
      register: _esp_unlocked_journal
      changed_when: false

    - name: "Assert systemd EMITTED the 'Reached target' signal this boot"
      ansible.builtin.assert:
        that: "'Reached target' in _esp_unlocked_journal.stdout"
        fail_msg: >-
          systemd did not log 'Reached target' for clevis-luks-unlocked.target this
          boot. Journal was: {{ _esp_unlocked_journal.stdout }}
        success_msg: "systemd reached clevis-luks-unlocked.target this boot."

    - name: "Assert unlock + assemble + check services all succeeded"  # noqa: command-instead-of-module
      ansible.builtin.command: "systemctl is-active {{ item }}"
      loop:
        - clevis-unlock-data.service
        - encrypted-storage-assemble.service
        - encrypted-storage-check.service
      register: _esp_svc
      changed_when: false
      failed_when: _esp_svc.stdout != "active"
      loop_control:
        label: "{{ item }}"

    - name: "Read boot-activation timestamps for the cross-role ordering chain"  # noqa: command-instead-of-module
      ansible.builtin.command: >-
        systemctl show -p ActiveEnterTimestampMonotonic --value {{ item }}
      loop:
        - clevis-unlock-data.service
        - clevis-luks-unlocked.target
        - encrypted-storage-assemble.service
      register: _esp_ts
      changed_when: false
      loop_control:
        label: "{{ item }}"

    - name: "Assert the SEAM ordering held at boot (unlock-data <= target <= assemble)"
      vars:
        _u: "{{ _esp_ts.results[0].stdout | int }}"
        _t: "{{ _esp_ts.results[1].stdout | int }}"
        _a: "{{ _esp_ts.results[2].stdout | int }}"
      ansible.builtin.assert:
        that:
          - (_u | int) > 0
          - (_t | int) > 0
          - (_a | int) > 0
          - (_u | int) <= (_t | int)
          - (_t | int) <= (_a | int)
        fail_msg: >-
          Cross-role seam ordering broken (ActiveEnterTimestampMonotonic µs):
          clevis-unlock-data={{ _u }}, clevis-luks-unlocked.target={{ _t }},
          encrypted-storage-assemble={{ _a }} — expected all >0 and non-decreasing.
        success_msg: >-
          Seam ordering OK: unlock-data({{ _u }}) <= unlocked.target({{ _t }})
          <= assemble({{ _a }}) µs.

    - name: "Resolve the data mappers' persistent names (crypt-<uuid>)"
      # Derived from the scenario's 10-disk list, not hardcoded.
      ansible.builtin.command: "cryptsetup luksUUID /dev/{{ item }}"
      loop: "{{ clevis_raw_disks }}"
      register: _data_uuids
      changed_when: false

    - name: "Assert every data mapper is open under its persistent crypt-<uuid> name"
      # item.stdout is the LUKS UUID; the mapper MUST be crypt-<uuid> (persistent
      # naming, clevis >=v2.0.0), never the legacy crypt-<node>. A missing mapper
      # here means a member did not unlock or the naming contract regressed.
      ansible.builtin.command: "cryptsetup status crypt-{{ item.stdout }}"
      loop: "{{ _data_uuids.results }}"
      changed_when: false
      loop_control:
        label: "crypt-{{ item.stdout }}"

    - name: "Assert the pool is mounted at {{ esp_mnt }}"
      ansible.builtin.command: "mountpoint -q {{ esp_mnt }}"
      changed_when: false

    # ── RAID10 profile assertions ────────────────────────────────────────────
    - name: "RAID10 (btrfs) | read the filesystem profile"
      ansible.builtin.command: "btrfs filesystem df {{ esp_mnt }}"
      register: _esp_btrfs_df
      changed_when: false
      when: esp_backend == 'btrfs'

    - name: "RAID10 (btrfs) | assert Data AND Metadata are both RAID10"
      ansible.builtin.assert:
        that:
          - "'Data, RAID10' in _esp_btrfs_df.stdout"
          - "'Metadata, RAID10' in _esp_btrfs_df.stdout"
        fail_msg: "btrfs pool is not RAID10: {{ _esp_btrfs_df.stdout }}"
        success_msg: "btrfs pool is RAID10 (data + metadata) across all members."
      when: esp_backend == 'btrfs'

    - name: "RAID10 (lvm) | read the LVM layout (including hidden sub-LVs)"
      ansible.builtin.command: >-
        lvs -a --noheadings -o lv_name,segtype,lv_layout
        {{ encrypted_storage_pool_name }}
      register: _esp_lvs
      changed_when: false
      when: esp_backend == 'lvm'

    - name: "RAID10 (lvm) | assert a raid10 thin pool + thin 'data' volume exist"
      # thin path: the pool's hidden data sub-LV is raid10, the pool is a thin-pool,
      # and the user-facing 'data' volume is thin.
      ansible.builtin.assert:
        that:
          - "'raid10' in _esp_lvs.stdout"
          - "'thin-pool' in _esp_lvs.stdout"
          - "'thin' in _esp_lvs.stdout"
        fail_msg: "expected a raid10 thin pool + thin 'data' LV: {{ _esp_lvs.stdout }}"
        success_msg: "LVM raid10 thin pool + thin 'data' volume present."
      when: esp_backend == 'lvm'

    - name: "RAID10 (lvm) | read the metadata LV's segment type + the PVs under its legs"
      ansible.builtin.command: >-
        lvs -a --noheadings -o lv_name,segtype,devices
        {{ encrypted_storage_pool_name }}
      register: _esp_lvs_meta
      changed_when: false
      when: esp_backend == 'lvm'

    - name: "RAID10 (lvm) | assert the thin pool's METADATA is mirrored, not linear on one disk"
      # A linear tmeta means one disk can destroy a raid10 pool: array intact,
      # metadata gone, pool unactivatable in any mode. It must be raid1 with its two
      # legs on DIFFERENT PVs — they are a mirror pair like any other.
      vars:
        _esp_meta_rows: >-
          {{ _esp_lvs_meta.stdout_lines | map('replace', '[', '')
             | map('replace', ']', '') | map('trim') | list }}
        _esp_meta_type: >-
          {{ (_esp_meta_rows | select('search', '^' ~ encrypted_storage_pool_lvm_thin_pool_name ~ '_tmeta +')
              | list | first | default('')).split()[1] | default('') }}
        _esp_meta_leg_pvs: >-
          {{ _esp_meta_rows | select('search', '_tmeta_rimage_')
             | map('split') | map('last') | map('regex_replace', '\(.*$', '') | list }}
      ansible.builtin.assert:
        that:
          - _esp_meta_type == 'raid1'
          - (_esp_meta_leg_pvs | length) == 2
          - (_esp_meta_leg_pvs | unique | length) == 2
        fail_msg: >-
          thin-pool metadata is '{{ _esp_meta_type }}' on legs {{ _esp_meta_leg_pvs }} —
          expected raid1 across two distinct PVs. Layout: {{ _esp_lvs_meta.stdout }}
        success_msg: >-
          thin-pool metadata is raid1 across two distinct PVs ({{ _esp_meta_leg_pvs | join(', ') }}).
      when: esp_backend == 'lvm'

    - name: "Assert real I/O on the pool survives the reboot (write + read back)"
      ansible.builtin.shell:
        cmd: |
          f="{{ esp_mnt }}/.esp-verify"
          echo esp-verified > "$f"
          test "$(cat "$f")" = esp-verified
          rm -f "$f"
        executable: /bin/bash
      changed_when: false

    - name: "Data integrity | ASSERT the payload written before reboot survived reboot + unlock"
      # sha256sum -c recomputes the on-pool payload and checks it against the digest
      # recorded on the (unencrypted) root fs BEFORE the reboot. Non-zero exit means
      # the data did NOT survive reboot/unlock byte-for-bit (or the pool/file is
      # missing) — the regression guard for the data-loss bug, now across 10 disks.
      ansible.builtin.command: "sha256sum -c {{ esp_expected }}"
      register: _esp_integrity
      changed_when: false

    - name: "PASS"
      ansible.builtin.debug:
        msg: >-
          Tier-2 RAID10 boot chain PASSED ({{ esp_backend }},
          {{ clevis_raw_disks | length }} disks) — clevis unlocked every disk at boot
          from the external Tang, clevis-luks-unlocked.target reached,
          encrypted_storage_pool assembled a RAID10 pool at {{ esp_mnt }} across the
          seam, real I/O round-trips, payload survived the reboot, and
          encrypted-storage-ready.target is active.
