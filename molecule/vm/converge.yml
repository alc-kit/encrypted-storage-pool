---
# Converge the split stack: clevis_encryption unlocks (NBDE-only, per host_vars)
# and encrypted_storage_pool assembles a btrfs/LVM pool across the
# clevis-luks-unlocked.target seam. Backend selected by $ESP_BACKEND.
#
# Only the target is converged; the Tang VM is infrastructure, not under test.
- name: "Converge — clevis NBDE unlock + encrypted_storage_pool"
  hosts: clevis-target
  become: true
  gather_facts: true
  vars:
    esp_backend: "{{ encrypted_storage_pool_backend | default('btrfs') }}"
    esp_mnt: "/srv/{{ encrypted_storage_pool_name | default('data') }}"
    esp_payload: "{{ esp_mnt }}/esp-integrity.bin"
    esp_expected: /var/lib/esp-integrity.expected.sha256

  # Deliberately include_role rather than `roles:`, so an explicit member ORDER can
  # be computed BETWEEN the two: clevis has to create the crypt-* mappers before
  # their names are knowable, and encrypted_storage_pool needs the order before it
  # creates the LV.
  tasks:
    - name: "Converge | clevis_encryption (NBDE-only)"
      ansible.builtin.include_role:
        name: clevis_encryption

    - name: "Converge | read the crypt-* members clevis just wrote"
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          awk '$1 ~ /^crypt-/ {sub(/^crypt-/, "", $1); print $1}' /etc/crypttab
        executable: /bin/bash
      register: _esp_test_members
      changed_when: false
      when: esp_backend == 'lvm'

    - name: "Converge | impose a REVERSED member order (lvm only)"
      # Reversed on purpose: crypttab order is what LVM would use if the explicit PV
      # list were ignored or mispositioned, so verify.yml asserting the reversed
      # mapping proves the order actually reached lvcreate and pinned placement.
      # A real caller passes a fault-domain-derived order here instead.
      ansible.builtin.set_fact:
        encrypted_storage_pool_device_order: "{{ _esp_test_members.stdout_lines | reverse | list }}"
      when: esp_backend == 'lvm'

    - name: "Converge | encrypted_storage_pool"
      ansible.builtin.include_role:
        name: encrypted_storage_pool

  # Once the pool is assembled + mounted (pre-reboot), seed a known payload and
  # record its digest OUTSIDE the pool. side_effect.yml then reboots and verify.yml
  # reads it back — proving the data survived both the reboot AND the LUKS unlock.
  post_tasks:
    - name: "Data integrity | assert the pool is mounted before seeding data"
      ansible.builtin.command: "mountpoint -q {{ esp_mnt }}"
      changed_when: false

    - name: "Data integrity | write a known 16 MiB random payload to the pool (pre-reboot)"
      ansible.builtin.command: "dd if=/dev/urandom of={{ esp_payload }} bs=1M count=16"
      changed_when: true

    - name: "Data integrity | record the payload sha256 on the root fs (outside the pool) + flush"
      # The digest lives on the unencrypted root fs so the post-reboot check is
      # independent of the pool: a pool that returns empty/corrupt is detected, not
      # masked. sync forces the payload out of cache to disk before the reboot.
      ansible.builtin.shell:
        cmd: |
          set -euo pipefail
          sha256sum "{{ esp_payload }}" > "{{ esp_expected }}"
          sync
        executable: /bin/bash
      changed_when: true
